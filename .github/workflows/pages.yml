name: Site
# Publishes akamachinecode.github.io/portplane: the landing page (site/) and
# the documentation pages made from docs/ by scripts/sitedocs. On a pull
# request the site is built (so a broken guide fails there) but not published.

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, scripts/sitedocs/**, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, docs/**, scripts/sitedocs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # the documentation pages, from the guides in docs/
      - run: go run ./scripts/sitedocs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write    # publish the site
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
