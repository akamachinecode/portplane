name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: internal/webui/dist
          include-hidden-files: true
          retention-days: 3

  go:
    name: Go (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then go test ./...; else go test -race ./...; fi
      - name: Build
        run: go build -o bin/ ./cmd/portplane
      - name: Smoke test
        shell: bash
        run: ./bin/portplane* version

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target without CGO
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/portplane
            echo "::endgroup::"
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/portplane-window
          done
      - name: portplane stays static on Linux
        # It is uploaded to remote machines as the agent (ADR-0015), which may
        # have no desktop libraries; only portplane-window loads GTK (ADR-0018).
        run: |
          if GOOS=linux go list -deps ./cmd/portplane | grep -q ebitengine/purego; then
            echo "::error::cmd/portplane imports purego on Linux; GTK code belongs in cmd/portplane-window"
            exit 1
          fi
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o portplane ./cmd/portplane
          if file portplane | grep -q interpreter; then
            echo "::error::the Linux portplane binary is dynamically linked"
            exit 1
          fi

  conventions:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$sha")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git show -s --format=%B "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is not signed off by its author ($author). Use 'git commit -s'."
              missing=1
            fi
          done
          exit $missing

  release-snapshot:
    name: Release snapshot
    needs: web
    # Same runner and tools as the release workflow, without signing or publishing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: internal/webui/dist
      - uses: jdx/mise-action@v5
        with:
          install_args: go goreleaser
      - run: goreleaser release --snapshot --clean --skip=sign,publish
      - name: Smoke test the darwin binary
        run: ./dist/darwin_darwin_arm64*/portplane version
      - name: The macOS app was packaged and sealed
        run: |
          ls -la dist/*.dmg
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/portplane_*_darwin_arm64.dmg >/dev/null
          codesign --verify --deep --strict --verbose=2 "$mnt/Portplane.app"
          "$mnt/Portplane.app/Contents/MacOS/portplane" version
          hdiutil detach "$mnt" >/dev/null

  integration:
    name: Integration (real dekit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dekit
        run: |
          curl -fsSL https://dekit.run/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: go build -o bin/portplane ./cmd/portplane
      - run: scripts/integration.sh bin/portplane
