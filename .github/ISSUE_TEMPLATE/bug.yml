name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version (`portplane version`, or the commit of the prototype)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: dekit and portless versions (`dekit --version`, `portless --version`)
  - type: textarea
    id: details
    attributes:
      label: Relevant output or screenshots
      description: Remove hostnames, paths and project names you do not want to make public.
      render: text
