[tools]
go = "1.27"
node = "24"
pnpm = "12"
golangci-lint = "2.15"
goreleaser = "2.20"

[tasks."web:install"]
description = "Install the web UI dependencies"
run = "pnpm -C web install --frozen-lockfile"

[tasks."web:build"]
description = "Build the web UI into internal/webui/dist"
depends = ["web:install"]
run = "pnpm -C web build"

[tasks.build]
description = "Build the portplane binary with the embedded UI"
depends = ["web:build"]
run = "go build -o bin/portplane ./cmd/portplane"

[tasks.test]
description = "Go and web tests"
run = ["go test ./...", "pnpm -C web test"]

[tasks.lint]
description = "Go and web linters and type checks"
run = ["golangci-lint run", "pnpm -C web typecheck"]
