# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Runs on a macOS runner (see .github/workflows/release.yml and ADR-0012).
# The web UI must be built into internal/webui/dist before this runs.
version: 2

project_name: portplane

before:
  hooks:
    - go run ./scripts/genicons -out build/icons

builds:
  - id: darwin
    main: ./cmd/portplane
    binary: portplane
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=1 # tray icon (ADR-0004)
    flags: [-trimpath]
    hooks:
      post:
        - cmd: packaging/macos/app.sh "{{ .Path }}" "{{ .Arch }}" "{{ .Version }}"
          output: true
    ldflags:
      - -s -w
      - -X github.com/akamachinecode/portplane/internal/buildinfo.version={{.Version}}
      - -X github.com/akamachinecode/portplane/internal/buildinfo.commit={{.Commit}}
      - -X github.com/akamachinecode/portplane/internal/buildinfo.date={{.Date}}
  - id: others
    main: ./cmd/portplane
    binary: portplane
    goos: [linux, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/akamachinecode/portplane/internal/buildinfo.version={{.Version}}
      - -X github.com/akamachinecode/portplane/internal/buildinfo.commit={{.Commit}}
      - -X github.com/akamachinecode/portplane/internal/buildinfo.date={{.Date}}
  # The Linux window: loads GTK 4 and WebKitGTK at run time, so it builds
  # without CGO and portplane itself stays static (ADR-0018).
  - id: window
    main: ./cmd/portplane-window
    binary: portplane-window
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: packages
    ids: [others, window]
    package_name: portplane
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Portplane contributors
    homepage: https://github.com/akamachinecode/portplane
    maintainer: Portplane contributors <https://github.com/akamachinecode/portplane/issues>
    description: Every dev server, on every machine, in one window.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    # The window needs WebKitGTK 6.0; without it the UI opens in the browser.
    overrides:
      deb:
        recommends: [libwebkitgtk-6.0-4, libadwaita-1-0]
      rpm:
        recommends: ["libwebkitgtk-6.0.so.4()(64bit)", "libadwaita-1.so.0()(64bit)"]
    contents:
      - src: packaging/linux/dev.portplane.app.desktop
        dst: /usr/share/applications/dev.portplane.app.desktop
      - src: build/icons/portplane.png
        dst: /usr/share/icons/hicolor/256x256/apps/portplane.png

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist/*.dmg

signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

changelog:
  disable: true # release-please writes the changelog and the release notes

release:
  extra_files:
    - glob: ./dist/*.dmg
  mode: keep-existing
  prerelease: auto
  footer: |
    **Verify a download:** `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp 'https://github.com/akamachinecode/portplane/' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`, then `sha256sum --check --ignore-missing checksums.txt`.
